<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Album ♡</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Pacifico&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose:   #f9a8b8;
            --deep:   #e05c7a;
            --blush:  #fde8ed;
            --cream:  #fff8f9;
            --soft:   #fcd5de;
            --text:   #4a2030;
            --shadow: rgba(224,92,122,0.18);
            --page-shadow: rgba(74,32,48,0.22);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--blush);
            font-family: 'Nunito', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 36px 16px 60px;
            overflow-x: hidden;
        }

        /* ── back link ── */
        .back-link {
            align-self: flex-start;
            display: inline-flex; align-items: center; gap: 6px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic; font-size: 1rem;
            color: var(--deep); text-decoration: none; opacity: 0.75;
            margin-bottom: 24px;
            transition: opacity 0.2s, transform 0.2s;
        }
        .back-link:hover { opacity: 1; transform: translateX(-3px); }

        /* ── header ── */
        .album-title {
            font-family: 'Pacifico', cursive;
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            color: var(--deep);
            text-shadow: 0 4px 18px rgba(224,92,122,0.18);
            margin-bottom: 6px;
            text-align: center;
        }
        .album-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic; font-size: 1.1rem;
            color: var(--deep); opacity: 0.65; margin-bottom: 48px;
            text-align: center;
        }

        /* ── book ── */
        .book-scene {
            width: 100%;
            max-width: 720px;
            perspective: 1600px;
        }

        .book {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 1.3;
            transform-style: preserve-3d;
        }

        /* left page (always visible "back" side) */
        .page-left, .page-right {
            position: absolute;
            top: 0; width: 50%; height: 100%;
            background: var(--cream);
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .page-left  { left: 0;   border-radius: 10px 0 0 10px; box-shadow: -4px 0 20px var(--page-shadow); }
        .page-right { right: 0;  border-radius: 0 10px 10px 0; box-shadow:  4px 0 20px var(--page-shadow); }

        /* spine line */
        .book::after {
            content: '';
            position: absolute; left: 50%; top: 0; bottom: 0;
            width: 4px; background: linear-gradient(to bottom, var(--rose), var(--deep), var(--rose));
            transform: translateX(-50%);
            z-index: 10;
        }

        /* flipping page */
        .flip-container {
            position: absolute;
            top: 0; left: 50%; width: 50%; height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
        }
        .flip-container.flipped { transform: rotateY(-180deg); }

        .flip-front, .flip-back {
            position: absolute; inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: var(--cream);
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            border-radius: 0 10px 10px 0;
            box-shadow: 4px 0 20px var(--page-shadow);
        }
        .flip-back {
            transform: rotateY(180deg);
            border-radius: 10px 0 0 10px;
        }

        /* page content */
        .page-content {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 6%;
            gap: 10px;
        }

        .page-photo {
            width: 100%; flex: 1;
            border-radius: 10px; overflow: hidden;
            box-shadow: 0 6px 20px var(--shadow);
            border: 4px solid #fff;
            min-height: 0;
        }
        .page-photo img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        .photo-placeholder {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--soft), var(--rose));
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; gap: 6px; font-size: clamp(1.6rem,4vw,2.2rem);
        }
        .photo-placeholder span {
            font-size: clamp(0.55rem,1.2vw,0.7rem);
            letter-spacing: 2px; text-transform: uppercase;
            font-family: 'Nunito'; font-weight: 600; opacity: 0.85;
        }

        .page-caption {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic; font-size: clamp(0.7rem, 1.6vw, 0.95rem);
            color: var(--deep); text-align: center; opacity: 0.8;
            line-height: 1.4;
        }
        .page-num {
            font-size: clamp(0.55rem,1.2vw,0.7rem);
            letter-spacing: 2px; color: var(--rose); opacity: 0.6;
        }

        /* cover */
        .cover-content {
            width: 100%; height: 100%;
            background: linear-gradient(145deg, var(--deep), #c94470);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 10px;
            border-radius: inherit;
        }
        .cover-content h2 {
            font-family: 'Pacifico', cursive;
            color: #fff; font-size: clamp(1.1rem,3vw,1.8rem);
            text-shadow: 0 2px 12px rgba(0,0,0,0.15);
            text-align: center; padding: 0 10px;
        }
        .cover-content .cover-heart { font-size: clamp(1.8rem,4vw,2.8rem); animation: pulse 1.8s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.15)} }
        .cover-content .cover-sub {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic; color: rgba(255,255,255,0.8);
            font-size: clamp(0.7rem,1.8vw,0.95rem);
        }

        /* nav buttons */
        .nav-row {
            display: flex; justify-content: center; align-items: center;
            gap: 24px; margin-top: 36px;
        }
        .nav-btn {
            background: #fff; border: 2px solid var(--soft);
            border-radius: 50px; padding: 12px 28px;
            font-family: 'Nunito', sans-serif; font-weight: 600;
            font-size: 0.9rem; color: var(--deep);
            cursor: pointer; transition: all 0.25s;
            box-shadow: 0 4px 16px var(--shadow);
            display: flex; align-items: center; gap: 8px;
        }
        .nav-btn:hover:not(:disabled) { background: var(--deep); color: #fff; border-color: var(--deep); transform: translateY(-2px); }
        .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .page-indicator {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic; font-size: 1rem;
            color: var(--deep); opacity: 0.65; min-width: 80px; text-align: center;
        }

        /* mobile stack */
        @media (max-width: 500px) {
            .book { aspect-ratio: 1 / 1.25; }
        }

    </style>
</head>
<body>

    <a href="index.html" class="back-link">← back home</a>

    <h1 class="album-title">Album</h1>
    <p class="album-subtitle">pics :p</p>

    <div class="book-scene">
        <div class="book" id="book">

            <!-- static left page: always shows "previous right" content -->
            <div class="page-left" id="page-left">
                <!-- filled by JS -->
            </div>

            <!-- static right page: shows current spread's right side when not flipping -->
            <div class="page-right" id="page-right">
                <!-- filled by JS -->
            </div>

            <!-- the flipping half -->
            <div class="flip-container" id="flip-container">
                <div class="flip-front" id="flip-front"></div>
                <div class="flip-back"  id="flip-back"></div>
            </div>

        </div>
    </div>

    <div class="nav-row">
        <button class="nav-btn" id="btn-prev">← prev</button>
        <span class="page-indicator" id="page-indicator"></span>
        <button class="nav-btn" id="btn-next">next →</button>
    </div>

    <script>

    const PAGES = [
        { caption: "",        photo: "pic2.jpg" },
        { caption: "",        photo: "" },
        { caption: "",        photo: "pic9.jpeg" },
        { caption: "",        photo: "" },
        { caption: "",        photo: "pic3.jpg" },
        { caption: "",        photo: "" },
        { caption: "",        photo: "pic5.jpg" },
        { caption: "",        photo: "" },
        { caption: "",        photo: "pic8.jpg" },
        { caption: "",        photo: "" },
        { caption: "",        photo: "pic4.jpg" },
        { caption: "",        photo: "" },
        { caption: "",        photo: "pic6.png" },
            
    ];

    const totalSpreads = 1 + Math.ceil(PAGES.length / 2);
    let currentSpread = 0;
    let isAnimating = false;

    function makeCover() {
        return `<div class="cover-content">
            <span class="cover-heart">💗</span>
            <h2>Album</h2>
            <span class="cover-sub">♡</span>
        </div>`;
    }

    function makeBlank(text) {
        return `<div class="page-content" style="justify-content:center;align-items:center;">
            <span style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--rose);opacity:0.4;font-size:1.1rem;">${text||''}</span>
        </div>`;
    }

    function makePhotoPage(pageIndex, position) {
        if (pageIndex < 0 || pageIndex >= PAGES.length) return makeBlank();
        const p = PAGES[pageIndex];
        const num = pageIndex + 1;
        const photoHTML = p.photo
            ? `<img src="${p.photo}" alt="${p.caption}">`
            : `<div class="photo-placeholder"><span>hai :3</span></div>`;
        return `<div class="page-content">
            <div class="page-photo">${photoHTML}</div>
            <p class="page-caption">${p.caption}</p>
        </div>`;
    }

    function getSpreadContent(spreadIndex) {
        // returns {left, right} HTML strings
        if (spreadIndex === 0) {
            return { left: makeBlank(''), right: makeCover() };
        }
        const leftPageIdx  = (spreadIndex - 1) * 2;
        const rightPageIdx = leftPageIdx + 1;
        return {
            left:  makePhotoPage(leftPageIdx),
            right: makePhotoPage(rightPageIdx)
        };
    }

    function render(spread) {
        const { left, right } = getSpreadContent(spread);
        document.getElementById('page-left').innerHTML  = left;
        document.getElementById('page-right').innerHTML = right;
        // reset flip
        const fc = document.getElementById('flip-container');
        fc.classList.remove('flipped');
        document.getElementById('flip-front').innerHTML = '';
        document.getElementById('flip-back').innerHTML  = '';

        // indicators
        const indicator = document.getElementById('page-indicator');
        indicator.textContent = spread === 0 ? 'cover' : `${spread} / ${totalSpreads - 1}`;
        document.getElementById('btn-prev').disabled = spread === 0;
        document.getElementById('btn-next').disabled = spread === totalSpreads - 1;
    }

    function goNext() {
        if (isAnimating || currentSpread >= totalSpreads - 1) return;
        isAnimating = true;

        const nextSpread = currentSpread + 1;
        const { right: nextLeft, left: _ } = { right: getSpreadContent(nextSpread).left, left: '' };
        // flip-front shows current right page
        const { right: curRight } = getSpreadContent(currentSpread);
        // flip-back shows next spread's left page
        const { left: nextLeftContent } = getSpreadContent(nextSpread);

        document.getElementById('flip-front').innerHTML = curRight;
        document.getElementById('flip-back').innerHTML  = nextLeftContent;

        // update static right to show next spread's right immediately (under the flip)
        document.getElementById('page-right').innerHTML = getSpreadContent(nextSpread).right;

        const fc = document.getElementById('flip-container');
        // trigger reflow
        fc.getBoundingClientRect();
        fc.classList.add('flipped');

        setTimeout(() => {
            currentSpread = nextSpread;
            render(currentSpread);
            isAnimating = false;
        }, 780);
    }

    function goPrev() {
        if (isAnimating || currentSpread <= 0) return;
        isAnimating = true;

        const prevSpread = currentSpread - 1;
        const { left: prevRight } = getSpreadContent(currentSpread);
        const { right: prevLeft  } = getSpreadContent(prevSpread);

        // start flipped, un-flip backward
        const fc = document.getElementById('flip-container');

        document.getElementById('flip-front').innerHTML = prevLeft;   // will end up visible
        document.getElementById('flip-back').innerHTML  = getSpreadContent(currentSpread).left;

        // update static left to previous spread left immediately
        document.getElementById('page-left').innerHTML = getSpreadContent(prevSpread).left;

        fc.classList.add('flipped');
        fc.getBoundingClientRect();
        fc.classList.remove('flipped');

        setTimeout(() => {
            currentSpread = prevSpread;
            render(currentSpread);
            isAnimating = false;
        }, 780);
    }

    document.getElementById('btn-next').onclick = goNext;
    document.getElementById('btn-prev').onclick = goPrev;

    // keyboard
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') goNext();
        if (e.key === 'ArrowLeft')  goPrev();
    });

    render(0);
    </script>
</body>
</html>
